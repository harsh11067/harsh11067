<svg xmlns="http://www.w3.org/2000/svg" width="880" height="118" viewBox="0 0 880 118" role="img" aria-label="How I build: imagine, commit, design, code, test, ship">
<style>.l { font: 650 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #c9d3e3; } .ring { opacity: 0; animation: ping 3.5s ease-out infinite; } .dot { animation: run 3.5s linear infinite; }
@keyframes ping { 0%, 100% { opacity: 0; } 4% { opacity: 1; } 18% { opacity: 0; } } @keyframes run { from { transform: translateX(0); } to { transform: translateX(800px); } }
@media (prefers-reduced-motion: reduce) { .ring, .dot { animation: none; } }</style>
<path d="M40 44H840" stroke="#2b4a7a" stroke-width="2" stroke-dasharray="4 6"/>
<circle class="dot" cx="40" cy="44" r="4" fill="#5fe08a"/>
